# Questo file era assente (fix C1): `flutter_lints` era dichiarato tra le
# dev_dependencies in pubspec.yaml ma, senza questo file, nessuna regola era
# davvero applicata dall'analyzer. È così che sono passati inosservati, tra
# gli altri, un uso di BuildContext dopo un await senza controllare
# `mounted` (product_form_screen.dart) e diverse chiamate a `withOpacity`,
# deprecato in favore di `withValues(alpha:)`.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Regole aggiuntive, oltre al set raccomandato di flutter_lints, mirate
    # ai pattern di bug effettivamente trovati in questo progetto durante
    # la revisione.
    - use_build_context_synchronously
    - unawaited_futures
    - always_declare_return_types
    - avoid_print

analyzer:
  errors:
    # In un progetto che genera codice con build_runner (hive_generator),
    # gli import dei file .g.dart risolvono solo dopo la generazione: non è
    # un errore da segnalare come tale.
    uri_has_not_been_generated: ignore
